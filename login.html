</head>
<body>

    <nav class="navbar navbar-light bg-white border-bottom p-3 px-4 navbar-fixed-top">
        <a class="navbar-brand d-flex align-items-center fw-bold" href="index.php">
            <img src="images/logo2.png" alt="Udyami Services" height="50"> Udyami Services

        <div class="d-flex gap-3 align-items-center">
            <a href="index.php" class="text-dark fw-semibold text-decoration-none d-none d-md-block">Home</a>

            <a href="become-a-tasker.php" class="btn btn-outline-success">Become a Tasker</a>
        </div>

    <div class="login-container text-center mt-5">
        <h2>Log in to Udyami Services</h2>
        <p>Or <a href="signup.html" class="link-text">sign up for a new account</a></p>

        <div id="message-container"></div>
        
        <button class="btn btn-social btn-google mb-3" id="google-login-btn">
            <i class="fab fa-google me-2"></i> Log in with Google
        </button>

        <div class="divider">or</div>

        <form id="email-login-form" class="mt-3">
            <input type="email" name="email" id="email" class="form-control mb-2" placeholder="Email address" required>
            <input type="password" name="password" id="password" class="form-control mb-3" placeholder="Password" required>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="link-text">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

        // Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyD-84LrmbOuwIRfi6Olj9LbFi_EVAc_Jew",
          authDomain: "udyami-2cf62.firebaseapp.com",
          projectId: "udyami-2cf62",
          storageBucket: "udyami-2cf62.firebasestorage.app",
          messagingSenderId: "404146319005",
          appId: "1:404146319005:web:2226ea2b10bac68da86e74",
          measurementId: "G-CYY61V2DRE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const messageContainer = document.getElementById('message-container');

        function showMessage(message, type) {
            messageContainer.innerHTML = `<div class="alert alert-${type} mt-4" role="alert">${message}</div>`;
        }

        // Email/Password Login
        const emailLoginForm = document.getElementById('email-login-form');
        emailLoginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    // On successful Firebase login, create a session on the backend
                    fetch('login.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: `email=${encodeURIComponent(email)}`,
                    })
                    .then(response => {
                        if (response.ok) {
                            window.location.href = 'dashboard.php';
                        } else {
                            showMessage("Failed to create session.", "danger");
                        }
                    })
                    .catch(error => {
                        showMessage("A network error occurred.", "danger");
                        console.error('Fetch error:', error);
                    });
                })
                .catch((error) => {
                    let errorMessage = "An unknown error occurred.";
                    switch(error.code) {
                        case 'auth/invalid-email':
                            errorMessage = "Invalid email address.";
                            break;
                        case 'auth/user-disabled':
                            errorMessage = "This account has been disabled.";
                            break;
                        case 'auth/invalid-credential':
                            errorMessage = "Invalid email or password.";
                            break;
                        default:
                            errorMessage = error.message;
                    }
                    showMessage(errorMessage, "danger");
                });
        });

        // Google Login
        const googleLoginBtn = document.getElementById('google-login-btn');
        const googleProvider = new GoogleAuthProvider();

        googleLoginBtn.addEventListener('click', () => {
            signInWithPopup(auth, googleProvider)
                .then((result) => {
                    const user = result.user;
                    const email = user.email;
                    const uid = user.uid;
                    const fullname = user.displayName;

                    fetch('login.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email, google_id: uid, fullname: fullname }),
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            window.location.href = 'dashboard.php';
                        } else {
                            showMessage("Login failed on backend: " + data.message, "danger");
                        }
                    })
                    .catch(error => {
                        showMessage("A network error occurred.", "danger");
                        console.error('Error sending data to backend:', error);
                    });
                })
                .catch((error) => {
                    console.error("Google sign-in error:", error.message);
                    showMessage("Google sign-in failed: " + error.message, "danger");
                });
        });
    </script>

</html>

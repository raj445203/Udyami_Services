<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Taskers List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <nav class="navbar navbar-light bg-white border-bottom p-3 px-4">
    <a class="navbar-brand d-flex align-items-center fw-bold" href="#">
      <img src="images/logo2.png" alt="TaskRabbit" height="50">HandyHelp
    </a>
    <div class="d-flex gap-3 align-items-center">
      <a href="#" class="text-dark fw-semibold text-decoration-none">Services</a>
      <a href="login.html" class="text-dark fw-semibold text-decoration-none">Sign up / Log in</a>
     <a href="become-a-tasker.html"> <button class="btn btn-outline-success">Become a Tasker</button></a>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="text-center mb-4" id="categoryTitle">Taskers</h2>
    <div id="taskerList" class="row g-4"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const category = urlParams.get('category');
    document.getElementById('categoryTitle').innerText = `${category} Taskers`;

    fetch(`http://localhost:3000/taskers?category=${category}`)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('taskerList');
        if (data.length === 0) {
          container.innerHTML = `<p class="text-center text-muted">No taskers found.</p>`;
        } else {
          data.forEach(tasker => {
            container.innerHTML += `
              <div class="col-md-4">
                <div class="card shadow">
                  <div class="card-body">
                    <h5 class="card-title">${tasker.name}</h5>
                    <p class="card-text">${tasker.skills.join(', ')}</p>
                    <p class="text-muted">${tasker.location}</p>
                    <button class="btn btn-primary w-100">Book Now</button>
                  </div>
                </div>
              </div>
            `;
          });
        }
      });
  </script>
</body>
</html>

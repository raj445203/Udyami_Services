<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandyHelp - Login & Signup</title>
    <!-- Bootstrap CSS for layout and components -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        /* General body styling */
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f4f8; /* A light, clean background color */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding-top: 75px; /* Add padding to the top to prevent content from being hidden by the fixed navbar */
        }

        /* Container for the entire login/signup card */
        .login-container {
            max-width: 450px;
            width: 90%;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        /* Heading style */
        .login-container h2 {
            font-weight: 700;
            color: #34495e;
            margin-bottom: 10px;
        }

        /* Subtitle style */
        .login-container p {
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        /* Button styling for social logins */
        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        /* Google button specific styles */
        .btn-google {
            background-color: #ffffff;
            color: #2c3e50;
            border: 1px solid #dcdde1;
        }
        .btn-google:hover {
            background-color: #f5f6fa;
        }

        /* Separator line with text */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #bdc3c7;
            margin: 25px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #bdc3c7;
        }

        .divider:not(:empty)::before {
            margin-right: .25em;
        }

        .divider:not(:empty)::after {
            margin-left: .25em;
        }

        /* Form input and button styles */
        .form-control {
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .btn-primary {
            background-color: #3498db; /* A friendly blue */
            border-color: #3498db;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #2980b9;
            border-color: #2980b9;
        }

        /* Link styles */
        .link-text {
            color: #3498db;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }
        .link-text:hover {
            text-decoration: underline;
        }

        /* Navbar fixed to top */
        .navbar-fixed-top {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1030;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <nav class="navbar navbar-light bg-white border-bottom p-3 px-4 navbar-fixed-top">
        <a class="navbar-brand d-flex align-items-center fw-bold" href="#">
            <img src="images/logo2.png" alt="HandyHelp" height="50">HandyHelp
        </a>
        <div class="d-flex gap-3 align-items-center">
            <a href="Services2.html" class="text-dark fw-semibold text-decoration-none d-none d-md-block">Services</a>
            <a href="login.html" class="text-dark fw-semibold text-decoration-none d-none d-md-block">Sign up / Log in</a>
            <a href="become-a-tasker.html"><button class="btn btn-outline-success">Become a Tasker</button></a>
            <button class="navbar-toggler d-md-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>
    <div class="collapse navbar-collapse bg-white d-md-none" id="navbarNav">
        <ul class="navbar-nav w-100 text-center">
            <li class="nav-item">
                <a class="nav-link text-dark fw-semibold" href="Services2.html">Services</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-dark fw-semibold" href="login.html">Sign up / Log in</a>
            </li>
        </ul>
    </div>

    <div class="login-container text-center">

        <!-- Login Form Container -->
        <div id="login-form">
            <h2>Log in to HandyHelp</h2>
            <p>Or <span id="show-signup" class="link-text">sign up for a new account</span></p>

            <button class="btn btn-social btn-google">
                <i class="fab fa-google me-2"></i> Log in with Google
            </button>
            

            <div class="divider">or</div>

            <form action="#" method="post">
                <input type="email" class="form-control" placeholder="Email address" required>
                <input type="password" class="form-control" placeholder="Password" required>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">
                            Remember me
                        </label>
                    </div>
                    <a href="#" class="link-text">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100">Log in</button>
            </form>
        </div>

        <!-- Signup Form Container (initially hidden) -->
        <div id="signup-form" class="d-none">
            <h2>Sign up for HandyHelp</h2>
            <p>Or <span id="show-login" class="link-text">log in to your existing account</span></p>

            <button class="btn btn-social btn-google">
                <i class="fab fa-google me-2"></i> Sign up with Google
            </button>
            
            <div class="divider">or</div>

            <form action="#" method="post">
                <input type="text" class="form-control" placeholder="Full name" required>
                <input type="email" class="form-control" placeholder="Email address" required>
                <input type="password" class="form-control" placeholder="Password" required>
                <button type="submit" class="btn btn-primary w-100">Sign up</button>
            </form>
        </div>

    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // JavaScript to toggle between login and signup forms
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const showSignupLink = document.getElementById('show-signup');
            const showLoginLink = document.getElementById('show-login');

            // Function to show the signup form and hide the login form
            function showSignup() {
                loginForm.classList.add('d-none');
                signupForm.classList.remove('d-none');
            }

            // Function to show the login form and hide the signup form
            function showLogin() {
                signupForm.classList.add('d-none');
                loginForm.classList.remove('d-none');
            }

            // Add event listeners to the toggle links
            if (showSignupLink) {
                showSignupLink.addEventListener('click', showSignup);
            }
            if (showLoginLink) {
                showLoginLink.addEventListener('click', showLogin);
            }

            // Prevent default form submission for demonstration
            document.querySelectorAll('form').forEach(form => {
                form.addEventListener('submit', function(event) {
                    event.preventDefault();
                    console.log('Form submitted. This is a demo.');
                    // In a real application, you would handle the form data here
                });
            });
        });
    </script>
</body>
</html>

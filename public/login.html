<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HandyHelp - Login / Signup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body, html {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: 'Segoe UI', sans-serif;
}

.bg-image {
  position: fixed;
  top: 0;
  left: 0;
  height: 100%;
  width: 100%;
  background: url(images/hero.png) no-repeat center center/cover;
  z-index: -2;
}

.overlay {
  background: rgba(0, 0, 0, 0.6);
  position: absolute;
  height: 100%;
  width: 100%;
  z-index: -1;
}

.glass-card {
  background: rgba(32, 97, 127, 0.08);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  color: white;
  width: 500px;
  
}

.logo {
  width: 70px;
  height: 70px;
  align-items: center;
  object-fit: contain;
  margin-left: 190px;
}

.auth-form input {
  background: rgba(255, 255, 255, 0.1);
  color: white;
  border: 1px solid rgba(255, 255, 255, 0.3);
}

.auth-form input::placeholder {
  color: #ccc;
}

  </style>
</head>
<body>

  <!-- Background -->
  <div class="bg-image">
    <div class="overlay"></div>
  </div>

  <!-- Auth Card -->
  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card p-4 glass-card text-center shadow-lg" style="max-width: 500px;">
      <img src="images/logo2.png" alt="HandyHelp Logo" class="logo mb-3">
      <h2 class="fw-bold mb-4">HandyHelp</h2>

      <!-- Form Toggle Buttons -->
      <div class="d-flex justify-content-center mb-3">
        <button class="btn btn-outline-light me-2" id="show-login">Login</button>
        <button class="btn btn-outline-light" id="show-signup">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form">
        <input type="text" id="login-username" class="form-control mb-2" placeholder="Username" required>
        <input type="password" id="login-password" class="form-control mb-3" placeholder="Password" required>
        <button type="submit" class="btn btn-success w-100">Login</button>
        <p class="text-danger mt-2" id="login-error"></p>
      </form>

      <!-- Signup Form -->
      <form id="signup-form" class="auth-form d-none">
        <input type="text" id="signup-username" class="form-control mb-2" placeholder="Choose Username" required>
        <input type="password" id="signup-password" class="form-control mb-2" placeholder="Create Password" required>
        <input type="password" id="signup-confirm" class="form-control mb-3" placeholder="Confirm Password" required>
        <button type="submit" class="btn btn-outline-light w-100">Sign Up</button>
        <p class="text-danger mt-2" id="signup-error"></p>
      </form>
    </div>
  </div>

  <script >
    const loginForm = document.getElementById('login-form');
const signupForm = document.getElementById('signup-form');
const showLogin = document.getElementById('show-login');
const showSignup = document.getElementById('show-signup');

showLogin.addEventListener('click', () => {
  loginForm.classList.remove('d-none');
  signupForm.classList.add('d-none');
});

showSignup.addEventListener('click', () => {
  signupForm.classList.remove('d-none');
  loginForm.classList.add('d-none');
});

// Signup logic
signupForm.addEventListener('submit', function(e) {
  e.preventDefault();
  const username = document.getElementById('signup-username').value;
  const password = document.getElementById('signup-password').value;
  const confirm = document.getElementById('signup-confirm').value;
  const error = document.getElementById('signup-error');

  if (password !== confirm) {
    error.textContent = 'Passwords do not match!';
    return;
  }

  localStorage.setItem(username, password);
  alert('Signup successful! You can now log in.');
  signupForm.reset();
  showLogin.click();
});

// Login logic
loginForm.addEventListener('submit', function(e) {
  e.preventDefault();
  const username = document.getElementById('login-username').value;
  const password = document.getElementById('login-password').value;
  const error = document.getElementById('login-error');

  const storedPassword = localStorage.getItem(username);

  if (storedPassword && storedPassword === password) {
    alert(`Welcome, ${username}! 🎉`);
    loginForm.reset();
  } else {
    error.textContent = 'Invalid credentials!';
  }
});

  </script>
</body>
</html>

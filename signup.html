<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandyHelp - Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <nav class="navbar navbar-light bg-white border-bottom p-3 px-4 navbar-fixed-top">
        <a class="navbar-brand d-flex align-items-center fw-bold" href="index.php">
            <img src="images/logo2.png" alt="HandyHelp" height="50"> Udyami Services
        </a>
        <div class="d-flex gap-3 align-items-center">
            <a href="index.php" class="text-dark fw-semibold text-decoration-none d-none d-md-block">Home</a>
            <a href="Services2.php" class="text-dark fw-semibold text-decoration-none">Services</a>
            <a href="login.html" class="text-dark fw-semibold text-decoration-none">Log in</a>
            <a href="become-a-tasker.php" class="btn btn-outline-success">Become a Tasker</a>
        </div>
    </nav>

    <div class="login-container text-center mt-5">
        <h2>Sign up for Udyami Services</h2>
        <p>Or <a href="login.html" class="link-text">log in to your existing account</a></p>

        <div id="message-container" class="mt-4"></div>

        <button class="btn btn-social btn-google mb-3" id="google-signup-btn">
            <i class="fab fa-google me-2"></i> Sign up with Google
        </button>

        <div class="divider">or</div>

        <form id="signup-form" class="mt-3">
            <input type="text" name="fullname" id="fullname" class="form-control mb-2" placeholder="Full name" required>
            <input type="email" name="email" id="email" class="form-control mb-2" placeholder="Email address" required>
            <input type="password" name="password" id="password" class="form-control mb-2" placeholder="Password" required>
            <input type="password" name="confirm_password" id="confirm_password" class="form-control mb-3" placeholder="Confirm Password" required>
            <button type="submit" class="btn btn-primary w-100">Sign up</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD-84LrmbOuwIRfi6Olj9LbFi_EVAc_Jew",
          authDomain: "udyami-2cf62.firebaseapp.com",
          projectId: "udyami-2cf62",
          storageBucket: "udyami-2cf62.firebasestorage.app",
          messagingSenderId: "404146319005",
          appId: "1:404146319005:web:2226ea2b10bac68da86e74",
          measurementId: "G-CYY61V2DRE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const messageContainer = document.getElementById('message-container');

        function showMessage(message, type) {
            messageContainer.innerHTML = `<div class="alert alert-${type}" role="alert">${message}</div>`;
        }

        const signupForm = document.getElementById('signup-form');
        signupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const fullname = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            if (password !== confirm_password) {
                showMessage("Passwords do not match.", "danger");
                return;
            }

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    fetch('signup.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            fullname: fullname,
                            email: email,
                            firebase_uid: user.uid,
                        }),
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            showMessage("Signup successful! You can now log in.", "success");
                            setTimeout(() => { window.location.href = 'login.html'; }, 3000);
                        } else {
                            showMessage("Signup failed: " + data.message, "danger");
                        }
                    })
                    .catch(error => {
                        showMessage("A network error occurred.", "danger");
                        console.error('Fetch error:', error);
                    });
                })
                .catch((error) => {
                    let errorMessage = "An error occurred.";
                    switch(error.code) {
                        case 'auth/email-already-in-use':
                            errorMessage = "This email is already in use.";
                            break;
                        case 'auth/invalid-email':
                            errorMessage = "Invalid email address.";
                            break;
                        case 'auth/weak-password':
                            errorMessage = "Password is too weak. It must be at least 6 characters.";
                            break;
                        default:
                            errorMessage = error.message;
                    }
                    showMessage(errorMessage, "danger");
                });
        });

        const googleSignupBtn = document.getElementById('google-signup-btn');
        const provider = new GoogleAuthProvider();

        googleSignupBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    const email = user.email;
                    const uid = user.uid;
                    const fullname = user.displayName;
                    
                    fetch('signup.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            fullname: fullname,
                            email: email,
                            firebase_uid: uid,
                            google_id: uid
                        }),
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            showMessage("Signup with Google successful! Redirecting...", "success");
                            setTimeout(() => { window.location.href = 'login.html'; }, 1000);
                        } else {
                            showMessage("Signup failed: " + data.message, "danger");
                        }
                    })
                    .catch(error => {
                        showMessage("A network error occurred.", "danger");
                        console.error('Fetch error:', error);
                    });
                })
                .catch((error) => {
                    let errorMessage = "An error occurred.";
                    switch(error.code) {
                        case 'auth/popup-closed-by-user':
                            errorMessage = "Sign up cancelled.";
                            break;
                        case 'auth/email-already-in-use':
                            errorMessage = "This email is already in use.";
                            break;
                        default:
                            errorMessage = error.message;
                    }
                    showMessage(errorMessage, "danger");
                });
        });
    </script>
</body>
</html>
